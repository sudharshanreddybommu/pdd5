version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: opmd_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: opmd_care
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opmd_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/opmd_care?schema=public
      JWT_SECRET: super_secret_opmd_jwt_key_2026_dev_secure
      ML_API_URL: http://ml-service:8000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - ml-service

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: opmd_ml_service
    restart: always
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opmd_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
